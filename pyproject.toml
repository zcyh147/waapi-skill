[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11.13,<3.12"
waapi-client = "==0.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "==8.4.2"
pytest-cov = "==5.0.0"
coverage = "==7.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["skills/wwise-waapi"]
markers = [
  "live: tests that require Wwise and WAAPI access",
  "destructive: tests that may mutate a fixture Wwise project",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["skills/wwise-waapi/wwise_waapi", "skills/wwise-waapi/scripts"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
